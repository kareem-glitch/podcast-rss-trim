name: Update trimmed feed

on:
  schedule:
    # 06:15 UTC every Monday
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild feed.xml
        run: python trim_feed.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain feed*.xml)" ]]; then
            echo "No change to feed.xml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A feed*.xml
          git commit -m "chore: refresh trimmed feed"
          git push
